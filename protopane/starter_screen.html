<div class="mx-auto max-w-2xl space-y-6 p-2">
  <div>
    <h1 class="text-3xl font-bold tracking-tight text-foreground">Welcome</h1>
    <p class="mt-1 text-sm text-muted-foreground">Theme this with the customer, then arrange a page.</p>
  </div>
  <div class="flex flex-wrap gap-2">
    <button class="inline-flex items-center justify-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:bg-primary/90">Primary</button>
    <button class="inline-flex items-center justify-center gap-2 rounded-md bg-secondary px-4 py-2 text-sm font-medium text-secondary-foreground hover:bg-secondary/80">Secondary</button>
    <button class="inline-flex items-center justify-center gap-2 rounded-md border border-input bg-background px-4 py-2 text-sm font-medium hover:bg-accent">Outline</button>
    <button class="inline-flex items-center justify-center gap-2 rounded-md bg-destructive px-4 py-2 text-sm font-medium text-destructive-foreground hover:bg-destructive/90">Destructive</button>
  </div>
  <div class="max-w-sm rounded-lg border bg-card text-card-foreground shadow-sm">
    <div class="flex flex-col gap-1.5 p-4">
      <div class="font-semibold leading-none tracking-tight">Card title</div>
      <div class="text-sm text-muted-foreground">A themed card.</div>
    </div>
    <div class="p-4 pt-0 text-sm">Card content goes here. Change the theme and watch this update.</div>
  </div>
  <div class="flex flex-wrap gap-2">
    <span class="inline-flex items-center rounded-full border border-transparent bg-primary px-2.5 py-0.5 text-xs font-semibold text-primary-foreground">Default</span>
    <span class="inline-flex items-center rounded-full border border-transparent bg-secondary px-2.5 py-0.5 text-xs font-semibold text-secondary-foreground">Secondary</span>
    <span class="inline-flex items-center rounded-full border border-border px-2.5 py-0.5 text-xs font-semibold text-foreground">Outline</span>
  </div>
</div>
