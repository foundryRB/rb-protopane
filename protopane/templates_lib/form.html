<div class="flex min-h-[28rem] items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-lg border bg-card text-card-foreground shadow-sm">
    <div class="space-y-1.5 p-6">
      <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
      <p class="text-sm text-muted-foreground">Enter your email below to sign in to your account.</p>
    </div>
    <div class="space-y-4 p-6 pt-0">
      <div class="grid gap-1.5">
        <label class="text-sm font-medium leading-none text-foreground">Email</label>
        <input type="email" placeholder="you@example.com" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm placeholder:text-muted-foreground sm:text-sm" />
      </div>
      <div class="grid gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium leading-none text-foreground">Password</label>
          <a class="text-xs text-muted-foreground hover:text-foreground">Forgot password?</a>
        </div>
        <input type="password" placeholder="********" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-sm placeholder:text-muted-foreground sm:text-sm" />
      </div>
      <label class="flex items-center gap-2 text-sm text-foreground">
        <span class="h-4 w-4 rounded border border-input"></span>
        Remember me
      </label>
      <button class="inline-flex h-9 w-full items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground hover:bg-primary/90">Sign in</button>
      <button class="inline-flex h-9 w-full items-center justify-center gap-2 rounded-md border border-input bg-background px-4 text-sm font-medium hover:bg-accent">Continue with GitHub</button>
    </div>
    <div class="border-t p-6 text-center text-sm text-muted-foreground">
      Don't have an account? <a class="font-medium text-foreground hover:underline">Sign up</a>
    </div>
  </div>
</div>
