apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "protopane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "protopane.selectorLabels" . | nindent 4 }}
  ports:
    # In OIDC mode the entry point is the oauth2-proxy sidecar (port 4180); otherwise
    # the app itself (8800). The published port stays 8800, so the platform HTTPRoute
    # is unchanged; only what it lands on moves behind the gate.
    - name: http
      port: 8800
      targetPort: {{ if .Values.auth.oidc.enabled }}oidc{{ else }}http{{ end }}
    # The east-west machine door: the app container directly, bypassing the OIDC
    # sidecar, for deterministic in-cluster reads (foundry-console renders this
    # studio's substance natively over REST). The Gateway never routes this port,
    # so it does not exist outside the cluster; pod-to-pod reachability of the app
    # container was always there — this names the trust boundary instead of hiding it.
    - name: internal
      port: 8801
      targetPort: http
