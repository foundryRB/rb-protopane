# Two released images (REF-Foundry section 4, the multi-image binding): the app SPA and
# its docs site, each promoted by its own Image Updater alias writing images.<component>.tag.
images:
  app:
    repository: ghcr.io/foundryrb/protopane-app
    tag: latest
    pullPolicy: Always
  docs:
    repository: ghcr.io/foundryrb/protopane-docs
    tag: latest
    pullPolicy: Always

# Pause switch: apps ship running. The platform scales the app to zero by
# overriding this to true on the app's ArgoCD Application (docs stay up).
paused: false

# Materialized in-namespace by foundry-platform. Set to [] when the GHCR package
# is public (ADR-015).
imagePullSecrets:
  - name: ghcr-pull

host: protopane.rb-foundry.com

# Per-team Gateway created by foundry-platform (platform/teams/protopane.yaml).
gateway:
  name: protopane
  namespace: network

persistence:
  size: 1Gi
  # storageClassName: local-path  # k3s default; uncomment to pin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Auth gate. Two modes; OIDC is the default (ADR-031).
#
# oidc.enabled true (default): oauth2-proxy fronts the human surfaces (SPA, /api),
#   authenticating them against this app's Keycloak realm (a "Sign in with Google"
#   button on the realm login). The app keeps its own HTTP Basic gate but scopes it
#   to the /mcp machine door (PROTOPANE_AUTH_SCOPE=mcp), which an agent authenticates
#   non-interactively; oauth2-proxy skips /mcp so those requests reach that gate.
#   Fail-closed holds on both halves: no keycloak-protopane credential and the proxy
#   crash-loops (human surfaces closed); no protopane-auth credential and /mcp answers
#   503.
# oidc.enabled false: HTTP Basic (scope=all) via envFrom of auth.existingSecret gates
#   every surface (SPA, /api, /mcp); fails closed (503) until that Secret exists
#   (PROTOPANE_AUTH_USER + PROTOPANE_AUTH_PASSWORD keys, provisioned out of band per
#   ADR-017). Set existingSecret to "" only for a deliberately non-public, otherwise-
#   gated instance.
auth:
  existingSecret: protopane-auth
  oidc:
    enabled: true
    issuer: https://keycloak.rb-foundry.com/realms/protopane
    clientId: protopane
    emailDomains: "*"
    # Client secret + cookie secret; minted in-cluster in this namespace by the
    # platform grant's generate-if-absent Job (gen-keycloak-protopane, ADR-034) and
    # reflected into the identity namespace for realm provisioning. Nothing to apply.
    existingSecret: keycloak-protopane
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.7.1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

# Non-secret app configuration. Rendered into a ConfigMap; loaded via envFrom.
# The shared event bus (foundry-platform ADR-041, REF-Events). Off by default: a
# hub whose install holds no bus grant states its facts to the log instead, and
# every act completes exactly as it would with a broker up, which is the one-way rule
# rather than a fallback. The two Secrets are what the grant produced
# (foundry-onboard-events): `nats-protopane` (key `seed`) is the keypair this hub's
# own generator minted in its namespace and never reflected anywhere;
# `nats-jwt-protopane` (key `user.jwt`) is the user JWT the platform signed for its
# public half and reflected back. The deployment assembles the two into the one
# credentials file a NATS client reads. `servers` is the bus's in-cluster address; it
# has no public one. To adopt the grant, flip `enabled` and change nothing else.
events:
  enabled: false
  servers: nats://nats.messaging.svc.cluster.local:4222
  seedSecret: nats-protopane
  jwtSecret: nats-jwt-protopane

config:
  PROTOPANE_PROJECTS_DIR: /data/projects
  # The MCP transport's DNS-rebinding guard admits localhost only by default;
  # a deployment must allow the Host header of its public hostname.
  PROTOPANE_MCP_ALLOWED_HOSTS: protopane.rb-foundry.com

# Per-app docs site served behind the central portal at docs.<domain>/apps/<app>
# (ADR-018). Built from docs/ by CI with base baked in; this just runs the image.
docs:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
