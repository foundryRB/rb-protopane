# Per-install values. Keys here are THIS install's own facts, pinned
# explicitly: the app chart's defaults belong to whichever install it was
# authored against, and an omitted key inherits them silently.
# Sign-in goes through this install's protopane realm (granted in teams/protopane).
protopane:
  host: protopane.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/protopane
      clientId: protopane
      existingSecret: keycloak-protopane
  images:
    app:
      repository: ghcr.io/foundryrb/protopane-app
      tag: 1.0.0
    docs:
      repository: ghcr.io/foundryrb/protopane-docs
      tag: 1.0.0
